<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地獄極楽六道縁途 モック（JG-002）</title>
<style>
/* JG-002 の画面。仮の図形と文字だけ。作り込みはしない */
:root {
  --bg: #1b1416; --panel: #2a2023; --line: #4a3a3e; --text: #f1e7e2; --dim: #b6a39c;
  --accent: #e0a040; --red: #d0453a; --enma: #8a2a26;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); gap: 6px; position: relative; overflow: hidden; }

/* 上：状態 */
#status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px; background: var(--panel); font-size: 15px; }
.incense { flex: 1 1 140px; height: 10px; background: #000; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; min-width: 100px; }
#incense-fill { display: block; height: 100%; background: linear-gradient(90deg, #6b5a50, #c9b9a8 92%, #ff7a2a); }
#forced { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 6px 10px; background: var(--red); font-size: 16px; }
#forced[hidden] { display: none; }

/* 中：法廷 */
#court { flex: 1 1 auto; min-height: 0; display: grid; gap: 6px; padding: 0 6px;
  grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 1.4fr);
  grid-template-areas: "icons view enma thought" "icons view enma speech"; }
@media (orientation: portrait) {
  #court { grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1.2fr) minmax(0, 0.7fr) minmax(0, 1.3fr);
    grid-template-areas: "icons view enma" "icons view thought" "speech speech speech"; }
}
#icons { grid-area: icons; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
#view { grid-area: view; }
#enma-wrap { grid-area: enma; display: flex; align-items: center; justify-content: center; min-height: 0; }
#thought { grid-area: thought; }
#speech { grid-area: speech; }
#view, #thought, #speech { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }

.icon { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line); background: #3a2c30; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0; flex: none; }
.icon span { font-size: 20px; }
.icon small { font-size: 9px; color: var(--dim); margin-top: 2px; }
.icon.on { border-color: var(--accent); background: #4d3a2a; }

#enma { width: min(100%, 260px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #b4443a, var(--enma)); display: flex; align-items: center; justify-content: center; font-size: clamp(40px, 9vmin, 96px); box-shadow: 0 0 0 4px #3a1a18; }
#enma.forced { animation: shake .25s infinite; background: radial-gradient(circle at 40% 35%, #ff6a4a, var(--red)); }
@keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-3px,1px); } 75% { transform: translate(3px,-1px); } }

h2, h3, h4 { margin: 0 0 6px; font-weight: normal; }
h3 { font-size: 16px; color: var(--accent); }
h4 { font-size: 14px; color: var(--dim); margin-top: 10px; }
.report { margin: 4px 0; font-size: 15px; }
.report.empty, .hint { color: var(--dim); font-size: 13px; }
.label { font-size: 12px; color: var(--dim); }
#thought p { margin: 4px 0; font-size: 16px; }

.gauge { display: grid; grid-template-columns: 1.6em auto 1fr; gap: 2px 8px; align-items: center; margin: 4px 0; }
.g-name { font-size: 18px; }
.g-bar { display: inline-flex; gap: 2px; }
.g-bar i { width: 10px; height: 14px; background: #000; border: 1px solid var(--line); }
.g-bar i.on { background: var(--accent); }
.g-level { font-size: 14px; }
.g-note { grid-column: 1 / -1; font-size: 13px; color: var(--dim); padding-left: 1.6em; }

/* 罪人：後ろ姿 */
.back { position: relative; width: 120px; height: 150px; margin: 10px auto 0; }
.back .head { position: absolute; left: 35px; top: 0; width: 50px; height: 50px; border-radius: 50%; background: #5d5050; }
.back .body { position: absolute; left: 10px; top: 46px; width: 100px; height: 100px; border-radius: 50px 50px 8px 8px; background: #d8d0c4; }

/* 証人：火の玉。種類ごとに動きだけ変える */
.witnesses { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 16px 0; }
.wit { position: relative; width: 96px; height: 96px; border: 1px dashed var(--line); border-radius: 12px; background: #1e1618; padding: 0; overflow: hidden; }
.ball { position: absolute; left: 34px; top: 34px; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #7fd0ff 45%, #2a6aff); box-shadow: 0 0 12px #7fd0ff; }
.wit.swarm .ball { width: 10px; height: 10px; left: calc(14px + var(--k) * 10px); top: 42px; animation-delay: calc(var(--k) * -0.13s) !important; }
.t-mosquito .ball { animation: buzz .18s infinite; }
.t-human .ball { animation: float 2.4s ease-in-out infinite; }
.t-pet .ball { animation: rub 1.2s ease-in-out infinite; }
.t-horse .ball { animation: gallop 1.1s linear infinite; }
.t-pig .ball { animation: push 0.9s ease-in-out infinite; }
.t-bird .ball { animation: circle 1.6s linear infinite; }
@keyframes buzz { 0% { transform: translate(0,0); } 25% { transform: translate(3px,-4px); } 50% { transform: translate(-3px,2px); } 75% { transform: translate(2px,4px); } }
@keyframes float { 0%,100% { transform: translateY(6px); } 50% { transform: translateY(-6px); } }
@keyframes rub { 0%,100% { transform: translateX(-14px) rotate(-8deg); } 50% { transform: translateX(14px) rotate(8deg); } }
@keyframes gallop { 0% { transform: translate(-30px, 0); } 25% { transform: translate(0, -18px); } 50% { transform: translate(30px, 0); } 75% { transform: translate(0, 18px); } 100% { transform: translate(-30px, 0); } }
@keyframes push { 0%,100% { transform: scale(1); } 50% { transform: scale(1.6) translateY(8px); } }
@keyframes circle { from { transform: rotate(0deg) translateX(22px) translateY(-14px) rotate(0deg); } to { transform: rotate(360deg) translateX(22px) translateY(-14px) rotate(-360deg); } }

/* 言葉の枠 */
.line { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.line b { display: inline-block; min-width: 3.5em; margin-right: 6px; font-weight: normal; padding: 0 4px; border-radius: 4px; font-size: 12px; text-align: center; }
.sp-case b { background: #5d5050; }
.sp-enma b { background: var(--enma); }
.sp-takamura b { background: #2f5a4a; }
.sp-jailer b { background: #444; }
.sp-witness b { background: #2a4a7a; }
.line.k-question span { color: var(--dim); }
.line.direction { color: var(--dim); font-style: italic; }

/* 下：質問と行き先 */
#questions, #dests { display: grid; gap: 6px; padding: 0 6px; }
#questions { grid-template-columns: repeat(8, minmax(0, 1fr)); }
#dests { grid-template-columns: repeat(7, minmax(0, 1fr)); }
@media (orientation: portrait) {
  #questions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #dests { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.q, .dest { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: #33272a; font-size: 14px; padding: 4px; }
.q .qn { color: var(--dim); font-size: 11px; margin-right: 4px; }
.q.asked { border-color: var(--accent); }
.q.asked::after { content: " ✓"; color: var(--accent); }
.dest { background: #3b2a22; font-size: 15px; }
.dest.d-remand { background: #2c3340; }
.dest.armed { background: var(--accent); color: #000; }
button:disabled { opacity: .35; }

/* 隅 */
#corner { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; justify-content: space-between; padding: 2px 10px 6px; font-size: 12px; color: var(--dim); }
#speed { display: inline-flex; gap: 4px; align-items: center; }
#speed button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: #2a2023; font-size: 13px; }
#speed button.on { background: var(--accent); color: #000; }

/* 朝・判決・昼・夜の画面（裁判パートの外。線香は燃えない） */
#overlay { position: absolute; inset: 0; background: rgba(15, 10, 12, .94); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px; z-index: 10; }
#overlay[hidden] { display: none; }
.sheet { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.sheet h2 { font-size: 24px; color: var(--accent); }
.sheet .mark { color: var(--red); }
.interlude { border-left: 3px solid #2f5a4a; padding: 4px 10px; margin: 10px 0; }
.interlude .tag { font-size: 11px; color: var(--dim); }
.news { padding-left: 1.2em; }
.news li { margin: 6px 0; font-size: 16px; }
.verdicts { padding-left: 1.4em; }
.verdicts li { margin: 6px 0; }
.verdicts .who { color: var(--dim); }
.verdicts em { color: var(--red); font-style: normal; font-size: 13px; }
.tally { border-top: 1px solid var(--line); padding-top: 8px; }
.next { display: block; width: 100%; margin-top: 12px; min-height: 48px; border-radius: 8px; border: 1px solid var(--accent); background: #4d3a2a; font-size: 17px; }

</style>
</head>

    <span id="st-case"></span>

    <span id="st-left"></span>

    <section id="thought"></section>
    <section id="speech"></section>

  <section id="dests" aria-label="行き先"></section>
  <footer id="corner"><span id="seed"></span><span id="speed"></span><span class="build">JG-002 build e403697c</span></footer>
  <div id="overlay" hidden></div>
</div>

// ---- src/rng.mjs
// シードを固定できる乱数（mulberry32）。DOM に触れない。
// 強制判決のランダム送りだけに使う。同じシードなら同じ並びになる。

function normalizeSeed(seed) {
  const n = Number(seed);
  return Number.isFinite(n) ? (Math.trunc(n) >>> 0) : 0;
}

function createRng(seed) {
  let a = normalizeSeed(seed);
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    // 0 以上 n 未満の整数
    int: (n) => Math.floor(next() * n),
    pick: (list) => list[Math.floor(next() * list.length)],
  };
}

// 判定まわりの選び方（コード側）。文面はデータ側に置く。DOM には触れない。

const FORMAT_VERSION = 3;

const REALMS = ['heaven', 'human', 'asura', 'animal', 'hungryGhost', 'hell'];

const REALM_VERDICTS = ['proper', 'wrongful', 'lenient'];
const REMAND_VERDICTS = ['retrial', 'proper'];
// 地蔵へ：エンマは裁かず地蔵菩薩に託す。評価は proper だけ（妥当・冤罪・見逃しの外）

const verdictsAllowedFor = (destination) =>
  destination === REMAND ? REMAND_VERDICTS : destination === JIZO ? JIZO_VERDICTS : REALM_VERDICTS;

const GAUGE_KEYS = ['kill', 'steal', 'sexual', 'lie', 'intoxicant'];
const GAUGE_LEVELS = ['none', 'nearlyNone', 'light', 'lightToMedium', 'medium', 'heavy', 'extreme'];

// 上流の4人の王（画面左の4アイコン）。秦広王・初江王・宋帝王・五官王
const UPSTREAM_KINGS = ['shinko', 'shoko', 'sotei', 'gokan'];

const WITNESS_TYPES = ['mosquito', 'human', 'pet', 'horse', 'pig', 'bird'];

// --- 件の種類で決まる振る舞い。JSON には書かず、ここで決める
const isMourning = (caseData) => caseData?.kind === MOURNING;

function selectableDestinations(caseData) {
  return isMourning(caseData) ? [JIZO] : [...REALMS, REMAND];
}
const canSelect = (caseData, destination) => selectableDestinations(caseData).includes(destination);
function assertSelectable(caseData, destination) {
  if (!canSelect(caseData, destination)) {
    throw new Error(`${caseData?.id}（${caseData?.kind}）は行き先 ${destination} を選べない（選べるのは ${selectableDestinations(caseData).join('・')}）`);
  }
}

// --- 質問・弁明の流れ（弔いの件。作者裁定 2026-10-03「弔いの件の流れ」）

//   「あー」も回数も語りの出どころも台本には書かせない。台本に書くのは篁の語りの文面（narration）だけ
const MOURNING_QUESTION_LIMIT = 2;

// その件で、いまこの質問を聞けるか。asked：その件で聞いた質問 id の並び（聞いた順、聞き直しも含む）
//   件ごとの上限は聞き直しも1回に数える（弔いの件の3回目は、同じ質問でも受け付けない）
//   一日の回数は同じ質問を数えない（params.questionsPerDay の注記）。一日の回数から引かない件では残りを見ない
//   dailyRemaining：一日の質問回数の残り
function canAsk({ caseData, asked = [], questionId, dailyRemaining = Infinity }) {
  const limit = questionLimitFor(caseData);
  if (limit !== null && asked.length >= limit) return false;
  if (!countsTowardDailyQuestions(caseData) || asked.includes(questionId)) return true;
  return dailyRemaining > 0;
}

// 質問を一つ聞く。状態は持たず、次の状態を返す（DOM に触れない）
//   返り値：{ asked, answer, dailyCost, narration }
//     dailyCost：一日の質問回数から引く数（0 か 1）。同じ質問の聞き直しと、弔いの件は 0
//     narration：この質問のあとに出す篁の語り（台本の narration）。出さないときは null
//       弔いの件では、上限（2回目）の質問のあとに出す
//   聞けない質問（弔いの件の3回目など）は例外
function askQuestion({ caseData, asked = [], questionId, dailyRemaining = Infinity }) {
  if (!canAsk({ caseData, asked, questionId, dailyRemaining })) {
    throw new Error(`${caseData?.id}（${caseData?.kind}）ではこれ以上質問できない（聞いた回数 ${asked.length}）`);
  }
  const repeated = asked.includes(questionId);
  const next = [...asked, questionId];
  const reachedLimit = next.length === questionLimitFor(caseData);
  return {
    asked: next,
    answer: answerFor(caseData, questionId),
    dailyCost: !repeated && countsTowardDailyQuestions(caseData) ? 1 : 0,
    narration: reachedLimit && usesNarration(caseData) ? caseData.narration : null,
  };
}

// 判決の記録（DATA_FORMAT「判決の記録」）を一つ作る。選べない行き先は記録させない
function makeVerdictRecord({ day, caseData, destination, forced = false, random = false }) {
  assertSelectable(caseData, destination);
  if (random && !forced) throw new Error('ランダム送りは強制判決のときだけ');
  return { formatVersion: FORMAT_VERSION, day, caseId: caseData.id, destination, forced, random };
}

// 幕間：出るタイミングと、台詞の話し手
//   nextMorning：翌朝／noon：その日の昼／afterVerdict：その件の判決の直後（行き先に関係なく）
//   jailer：獄吏（声だけ）
const INTERLUDE_TIMINGS = ['nextMorning', 'noon', 'afterVerdict'];
const INTERLUDE_SPEAKERS = ['takamura', 'enma', 'case', 'jailer', 'direction'];

// 「ニュースなし」の印。わざと何も起きない結果。空欄や書き忘れとは別物
const isNoNews = (v) => v !== null && typeof v === 'object' && v.none === true;
const isNewsText = (v) => typeof v === 'string' && v.trim() !== '';

// ある亡者をある行き先に送ったときの翌朝のニュースを一本に決める。
// 行き先ごとの上書きが最優先、なければその行き先の評価の既定ニュース。
// 差し戻しは上書きだけを見る（評価の既定は六道に送った結果の文面なので流用しない）。
//   { text, from }         ニュースが出る
//   { none: true, from }   わざと何も起きない（「ニュースなし」の印）
//   null                   決まらない（書き忘れ。差し戻しは幕間で受けるので null でよい）
//   弔いの件は常に { none: true, from: 'kind.mourning' }。選べない行き先を渡すと例外
function resolveNews(caseData, destination) {
  assertSelectable(caseData, destination);
  if (!producesNews(caseData)) return { none: true, from: `kind.${MOURNING}` };
  const pick = (v, from) => {
    if (isNoNews(v)) return { none: true, from };
    if (isNewsText(v)) return { text: v, from };
    return null;
  };
  const override = pick(caseData.news?.overrides?.[destination], `overrides.${destination}`);
  if (override || destination === REMAND) return override;
  const verdict = caseData.verdicts?.[destination];
  return (verdict && pick(caseData.news?.defaults?.[verdict], `defaults.${verdict}`)) || null;
}

// --- 幕間の選び方。JSON には条件を書かず、ここで決める

// 差し戻しの翌朝の幕間：件ごとの上書き → 共通の既定
const REMAND_INTERLUDE_DEFAULT = 'remand-default';
const REMAND_INTERLUDE_BY_CASE = {
  'inkyo-setomonoya': 'remand-inkyo-setomonoya',
  'moto-eigyoman': 'remand-moto-eigyoman',
};

// 判決に関係なく、その件を裁いた日に出る幕間
const CASE_INTERLUDES = {
  chikusan: ['katsudon-chikusan'],
  ringoya: ['mirror-ringoya'],
};

// 出しどころが未確定の幕間（データはあるが、まだどこにも出さない）
const UNSCHEDULED_INTERLUDES = [];

function remandInterludeId(caseId) {
  return REMAND_INTERLUDE_BY_CASE[caseId] ?? REMAND_INTERLUDE_DEFAULT;
}

// 判決の記録（DATA_FORMAT「判決の記録」）から、出す幕間の id を並べる。
//   day 日目に裁いた件 → その日の幕間（例：昼のカツ丼、判決直後の鏡の場面）。いつ出すかは幕間の timing
//   day 日目に差し戻した件（評価 retrial）→ day+1 日目の朝の幕間
//   差し戻しが妥当（評価 proper。水木のような件）なら再審の幕間は出さない
// cases：caseId → 一件の台本。返り値：[{ day, interludeId, caseId }]。
// 並び順・重複の扱いは画面側（JG-002）で決める
function interludesFor(records, cases) {
  const out = [];
  for (const r of records) {
    for (const id of CASE_INTERLUDES[r.caseId] ?? []) out.push({ day: r.day, interludeId: id, caseId: r.caseId });
    if (r.destination === REMAND && cases[r.caseId]?.verdicts?.[REMAND] === 'retrial') {
      out.push({ day: r.day + 1, interludeId: remandInterludeId(r.caseId), caseId: r.caseId });
    }
  }
  return out;
}

// コード側で名指ししている幕間 id（check-data が data/interludes.json との対応を見る）
const REFERENCED_INTERLUDES = [
  REMAND_INTERLUDE_DEFAULT,
  ...Object.values(REMAND_INTERLUDE_BY_CASE),
  ...Object.values(CASE_INTERLUDES).flat(),
  ...UNSCHEDULED_INTERLUDES,
];

// ---- src/day.mjs
// 一日の進行（朝 → 裁判 → 夜 → 翌朝）。DOM に触れない。画面はこの状態を読むだけ。
// 判定（選べる行き先・質問の答え・判決の記録・ニュース・幕間の選び方）は src/rules.mjs をそのまま呼ぶ。
// ここで持つのは時間の進み方（線香・強制判決・ランダム送り・残業代）と、画面の順番だけ。
// 時間は tick(秒) で外から進める（実時間かどうか、速さ何倍かは画面側の都合）。




// 一日目の件の並び。平常の亡者（ベースライン）を先に、昼休みの前に家畜産業の人（昼のカツ丼）、
// 最後にリンゴ屋（判決の直後に鏡の場面）。R-023
const DAY1_CASE_ORDER = [
  'inkyo-setomonoya', 'moto-eigyoman', 'chikusan',
  'migatte', 'keibajo-nushi', 'ringoya',
];

// 昼休みは、その日の件の半分（切り上げ）を裁いたあと。R-024
const noonAfter = (caseCount) => Math.ceil(caseCount / 2);

const PHASES = ['morning', 'trial', 'verdict', 'noon', 'night', 'end'];

const PARAM_KEYS = [
  'questionsPerDay', 'incenseSecondsPerQuestion', 'forcedVerdictGraceSeconds',
  'forcedVerdictRandomSeconds', 'overtimePayPerSecond', 'earningsPerCase',
];

function readParams(paramsJson) {
  const out = {};
  for (const k of PARAM_KEYS) {
    const v = paramsJson?.params?.[k]?.value;
    if (typeof v !== 'number') throw new Error(`params.json に ${k} の数値がない`);
    out[k] = v;
  }
  return out;
}

// cases：一件の台本の並び／interludes：data/interludes.json の interludes／questions：data/questions.json の questions
function createGame({ cases, interludes, questions, params, seed, order = DAY1_CASE_ORDER }) {
  const P = readParams(params);
  const casesById = Object.fromEntries(cases.map((c) => [c.id, c]));
  const interludesById = Object.fromEntries(interludes.map((i) => [i.id, i]));
  const questionsById = Object.fromEntries(questions.map((q) => [q.id, q]));
  for (const id of order) if (!casesById[id]) throw new Error(`一日目の並びに台本のない件がある：${id}`);
  const rng = createRng(seed);

  const s = {
    seed: normalizeSeed(seed),
    params: P,
    day: 0,
    phase: 'morning',
    money: 0,
    records: [],
    morning: null,    // { items: [{ type: 'greeting' } | { type: 'news', caseId, text } | { type: 'interlude', ... }] }
    dayCaseIds: [],
    caseIndex: 0,
    noonDone: false,
    asksUsed: 0,      // 一日の質問回数から引いた数（同じ質問の聞き直しと、引かない件は入らない）
    incenseBurned: 0, // 線香が燃えた秒数（裁判パートの間だけ）
    dayOvertime: 0,   // その日の残業代（所持金から引いた額）
    pendingNoon: [],
    current: null,    // { caseId, asked, log, forced, forcedElapsed, overtimeSeconds }
    verdict: null,    // { record, interludes }
    noon: null,       // { interludes }
    night: null,      // { records, processed, earnings, overtime }
  };

  const caseOf = (id) => casesById[id];
  const currentCase = () => (s.current ? caseOf(s.current.caseId) : null);
  const interludeEntry = (e) => ({ type: 'interlude', ...e, ...pickInterlude(e.interludeId) });
  function pickInterlude(id) {
    const i = interludesById[id];
    if (!i) throw new Error(`幕間 ${id} がデータにない`);
    return { timing: i.timing, lines: i.lines, provisional: i.provisional };
  }

  // 一日の質問回数の残り（整数）。線香は incenseSecondsPerQuestion 秒ごとに 1 減らす
  const dailyRemaining = () =>
    P.questionsPerDay - s.asksUsed - Math.floor(s.incenseBurned / P.incenseSecondsPerQuestion);
  // 線香の長さ（0〜1）。燃えている途中の分も含めて連続に減る
  const incenseFraction = () => Math.max(0, Math.min(1,
    (P.questionsPerDay - s.asksUsed - s.incenseBurned / P.incenseSecondsPerQuestion) / P.questionsPerDay));
  const incenseOut = () => dailyRemaining() <= 0;

  function startMorning() {
    s.day += 1;
    const prev = s.records.filter((r) => r.day === s.day - 1);
    const items = [];
    if (s.day === 1) items.push({ type: 'greeting' });
    // 前日の判決のニュース（差し戻しは幕間で受けるので出さない。「ニュースなし」も出さない）
    for (const r of prev) {
      if (r.destination === REMAND) continue;
      const news = resolveNews(caseOf(r.caseId), r.destination);
      if (news?.text) items.push({ type: 'news', caseId: r.caseId, destination: r.destination, text: news.text });
    }
    // 翌朝の幕間：差し戻しの幕間（day が今日）と、前日に裁いた件の nextMorning の幕間
    const seen = new Set();
    for (const e of interludesFor(prev, casesById)) {
      const { timing } = pickInterlude(e.interludeId);
      const today = e.day === s.day || (e.day === s.day - 1 && timing === 'nextMorning');
      const key = `${e.interludeId}/${e.caseId}`;
      if (!today || timing !== 'nextMorning' || seen.has(key)) continue;
      seen.add(key);
      items.push(interludeEntry(e));
    }
    s.morning = { items };
    // 一日目は決まった並び。二日目からは前日に差し戻した件（再審）
    s.dayCaseIds = s.day === 1 ? [...order] : [...new Set(prev.filter((r) => r.destination === REMAND).map((r) => r.caseId))];
    s.caseIndex = 0;
    s.noonDone = false;
    s.asksUsed = 0;
    s.incenseBurned = 0;
    s.dayOvertime = 0;
    s.pendingNoon = [];
    s.current = null;
    s.verdict = null;
    s.noon = null;
    s.night = null;
    s.phase = 'morning';
  }

  function startCase() {
    const id = s.dayCaseIds[s.caseIndex];
    const c = caseOf(id);
    s.current = {
      caseId: id,
      index: s.caseIndex,
      asked: [],
      log: [{ kind: 'plea', speaker: 'case', text: pleaFor(c) }],
      forced: false,
      forcedElapsed: 0,
      overtimeSeconds: 0,
    };
    s.phase = 'trial';
    if (consumesIncense(c) && incenseOut()) startForced();
  }

  function startForced() {
    s.current.forced = true;
    s.current.forcedElapsed = 0;
    s.current.overtimeSeconds = 0;
  }

  function finishCase(record) {
    s.records.push(record);
    const shown = [];
    for (const e of interludesFor([record], casesById)) {
      if (e.day !== s.day) continue; // 翌朝の分は朝に records から引き直す
      const entry = interludeEntry(e);
      if (entry.timing === 'afterVerdict') shown.push(entry);
      // 昼の幕間：昼休みの前なら昼休みに、過ぎていたら判決の直後に出す（R-024）
      else if (entry.timing === 'noon') (s.noonDone ? shown : s.pendingNoon).push(entry);
    }
    s.verdict = { record, interludes: shown };
    s.caseIndex += 1;
    s.phase = 'verdict';
  }

  function nextCaseOrNight() {
    s.verdict = null;
    s.noon = null;
    if (s.caseIndex < s.dayCaseIds.length) return startCase();
    const today = s.records.filter((r) => r.day === s.day);
    const processed = today.filter((r) => r.destination !== REMAND).length; // 差し戻しは処理件数に含めない
    const earnings = processed * P.earningsPerCase;
    s.money += earnings;
    s.current = null;
    s.night = { records: today, processed, earnings, overtime: s.dayOvertime };
    s.phase = 'night';
  }

  const game = {
    state: s,
    params: P,
    caseOf,
    currentCase,
    question: (id) => questionsById[id],
    questions: [...questions].sort((a, b) => a.order - b.order),
    dailyRemaining: () => Math.max(0, dailyRemaining()),
    incenseFraction,
    incenseOut,
    // 強制判決の残り（ランダム送りまで・持ち時間まで）
    forcedClock() {
      if (!s.current?.forced) return null;
      const t = s.current.forcedElapsed;
      return {
        elapsed: t,
        graceLeft: Math.max(0, P.forcedVerdictGraceSeconds - t),
        randomLeft: Math.max(0, P.forcedVerdictRandomSeconds - t),
      };
    },
    selectable: () => (currentCase() ? selectableDestinations(currentCase()) : []),

    canAskNow(questionId) {
      if (s.phase !== 'trial' || s.current.forced) return false;
      return canAsk({ caseData: currentCase(), asked: s.current.asked, questionId, dailyRemaining: game.dailyRemaining() });
    },

    ask(questionId) {
      if (s.phase !== 'trial') throw new Error('裁判パートの外では質問できない');
      if (s.current.forced) throw new Error('強制判決のあいだは質問できない');
      const c = currentCase();
      const res = askQuestion({ caseData: c, asked: s.current.asked, questionId, dailyRemaining: game.dailyRemaining() });
      s.current.asked = res.asked;
      s.asksUsed += res.dailyCost;
      s.current.log.push({ kind: 'question', speaker: 'enma', text: questionsById[questionId].text, questionId });
      s.current.log.push({ kind: 'answer', speaker: 'case', text: res.answer, questionId });
      for (const l of res.narration ?? []) s.current.log.push({ kind: 'narration', speaker: l.speaker, text: l.text });
      // 最後の一回で線香が尽きたら、その場で強制判決
      if (consumesIncense(c) && incenseOut()) startForced();
      return res;
    },

    // 証人（火の玉）の台詞を聞く。判定には関わらない
    hearWitness(index) {
      if (s.phase !== 'trial') return;
      const w = currentCase().witnesses?.[index];
      if (!w) return;
      for (const text of w.lines) s.current.log.push({ kind: 'witness', speaker: 'witness', text, witnessIndex: index });
    },

    // プレイヤーが行き先を決める（強制判決中も同じ入口。記録の forced に残る）
    decide(destination) {
      if (s.phase !== 'trial') throw new Error('裁判パートの外では判決できない');
      const record = makeVerdictRecord({ day: s.day, caseData: currentCase(), destination, forced: s.current.forced, random: false });
      finishCase(record);
      return record;
    },

    // 時間を進める（秒）。線香は裁判パートの間だけ燃える。強制判決中は持ち時間を数える
    tick(seconds) {
      if (s.phase !== 'trial' || !(seconds > 0)) return;
      const c = currentCase();
      if (!s.current.forced) {
        if (!consumesIncense(c)) return;
        s.incenseBurned += seconds;
        if (incenseOut()) startForced();
        return;
      }
      const cur = s.current;
      cur.forcedElapsed += seconds;
      const over = Math.floor(Math.max(0, Math.min(cur.forcedElapsed, P.forcedVerdictRandomSeconds) - P.forcedVerdictGraceSeconds));
      if (over > cur.overtimeSeconds) {
        const pay = (over - cur.overtimeSeconds) * P.overtimePayPerSecond;
        s.money -= pay; // 所持金はフレーバー。マイナスになっても止めない
        s.dayOvertime += pay;
        cur.overtimeSeconds = over;
      }
      if (cur.forcedElapsed >= P.forcedVerdictRandomSeconds) {
        const destination = rng.pick(selectableDestinations(c));
        finishCase(makeVerdictRecord({ day: s.day, caseData: c, destination, forced: true, random: true }));
      }
    },

    // 画面を一つ進める（朝 → 裁判、判決 → 昼休み／次の件／夜、夜 → 翌朝）
    advance() {
      switch (s.phase) {
        case 'morning':
          if (s.dayCaseIds.length === 0) { s.phase = 'end'; return; }
          return startCase();
        case 'verdict':
          if (!s.noonDone && s.caseIndex >= noonAfter(s.dayCaseIds.length)) {
            s.noonDone = true;
            if (s.pendingNoon.length) {
              s.verdict = null;
              s.noon = { interludes: s.pendingNoon };
              s.pendingNoon = [];
              s.phase = 'noon';
              return;
            }
          }
          return nextCaseOrNight();
        case 'noon':
          return nextCaseOrNight();
        case 'night':
          return startMorning();
        default:
          return;
      }
    },
  };

  startMorning();
  return game;
}

// --- シードと時間の速さ

// --- 小さな部品
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
const $ = (id) => document.getElementById(id);
// 子を入れ替える（配列は平らにする。native の replaceChildren は配列を文字列にしてしまう）
const put = (node, ...kids) => node.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false));

function lineNode(l, caseName = SPEAKER_LABEL.case) {
  if (l.speaker === 'direction') return el('p', { class: 'line direction', text: l.text });
  const who = l.speaker === 'case' ? caseName : SPEAKER_LABEL[l.speaker] ?? l.speaker;
  return el('p', { class: `line sp-${l.speaker} k-${l.kind ?? ''}` }, el('b', { text: who }), el('span', { text: l.text }));
}

function interludeNodes(list) {
  return list.map((i) => el('div', { class: 'interlude' },
    el('div', { class: 'tag', text: `幕間${i.provisional ? '（仮）' : ''}` }),
    i.lines.map((l) => lineNode(l))));
}

// --- 描画
function render() {
  ui.lastKey = stateKey();
  renderStatus();
  renderCourt();
  renderQuestions();
  renderDestinations();
  renderOverlay();
}

function stateKey() {
  return [s.phase, s.day, s.caseIndex, s.current?.forced, s.current?.log.length].join('|');
}

function renderStatus() {
  const total = s.dayCaseIds.length;
  const no = s.phase === 'trial' ? s.current.index + 1 : Math.min(s.caseIndex, total);
  $('st-day').textContent = `${s.day}日目`;
  $('st-case').textContent = total ? `亡者 ${no}／${total}` : '亡者 —';
  updateClock();
}

// 毎フレーム更新する数字（線香・質問回数・所持金・強制判決の時計）
function updateClock() {
  const f = game.incenseFraction();
  $('incense-fill').style.width = `${(f * 100).toFixed(1)}%`;
  $('st-left').textContent = `残り ${game.dailyRemaining()} 回`;
  $('st-asked').textContent = `質問 ${s.asksUsed}／${game.params.questionsPerDay}`;
  $('st-money').textContent = `所持金 ${s.money}`;
  const clock = game.forcedClock();
  const banner = $('forced');
  if (s.phase === 'trial' && clock) {
    banner.hidden = false;
    $('forced-clock').textContent = clock.graceLeft > 0
      ? `持ち時間 あと ${Math.ceil(clock.graceLeft)} 秒`
      : `残業中（残業代 −${s.current.overtimeSeconds * game.params.overtimePayPerSecond}）　ランダム送りまで ${Math.ceil(clock.randomLeft)} 秒`;
  } else banner.hidden = true;
}

function renderCourt() {
  const c = game.currentCase();
  const trial = s.phase === 'trial';
  // 左のアイコン列
  const icons = $('icons');
  put(icons, ...VIEWS.map((v) => el('button', {
    class: `icon${ui.view === v.id ? ' on' : ''}`, 'aria-label': v.label, title: v.label,
    onclick: () => { ui.view = v.id; renderCourt(); },
  }, el('span', { text: v.icon }), el('small', { text: v.label }))));
  // 中央のエンマ
  $('enma').classList.toggle('forced', !!s.current?.forced && trial);
  // 視点の枠
  const view = $('view');
  if (!c) { put(view); put($("thought")); put($("speech")); return; }
  const king = KINGS.find((k) => k.id === ui.view);
  if (king) {
    const lines = c.upstream?.[king.id] ?? [];
    put(view,
      el('h3', { text: `${king.name}の報告` }),
      lines.length ? lines.map((t) => el('p', { class: 'report', text: t })) : el('p', { class: 'report empty', text: '（記載なし）' }),
      el('h4', { text: '計器' }),
      king.gauges.map((g) => gaugeNode(g, c.gauges[g])),
    );
  } else if (ui.view === 'sinner') {
    put(view, el('h3', { text: '罪人' }), el('div', { class: 'back' }, el('div', { class: 'head' }), el('div', { class: 'body' })),
      el('p', { class: 'hint', text: '（後ろ姿）' }));
  } else {
    put(view, el('h3', { text: '証人' }),
      el('div', { class: 'witnesses' }, (c.witnesses ?? []).map((w, i) => el('button', {
        class: `wit t-${w.type}${w.swarm ? ' swarm' : ''}`, 'aria-label': `証人${i + 1}`,
        onclick: () => { game.hearWitness(i); renderCourt(); },
      }, (w.swarm ? [0, 1, 2, 3, 4, 5, 6] : [0]).map((k) => el('i', { class: 'ball', style: `--k:${k}` }))))),
      el('p', { class: 'hint', text: '火の玉をタップすると証言' }));
  }
  // 右上：エンマの心の声（観察）
  put($('thought'), el('div', { class: 'label', text: 'エンマの心の声' }), el('p', { text: c.observation }));
  // 右下：言葉の枠
  const speech = $('speech');
  put(speech, ...s.current.log.map((l) => lineNode(l)));
  speech.scrollTop = speech.scrollHeight;
}

function gaugeNode(key, g) {
  const idx = LEVELS.indexOf(g?.level);
  return el('div', { class: 'gauge' },
    el('span', { class: 'g-name', text: GAUGE_LABEL[key] }),
    el('span', { class: 'g-bar' }, LEVELS.slice(1).map((_, i) => el('i', { class: i < idx ? 'on' : '' }))),
    el('span', { class: 'g-level', text: idx >= 0 ? LEVEL_LABEL[g.level] : '（段階の記載なし）' }),
    g?.note ? el('div', { class: 'g-note', text: g.note }) : null);
}

function renderQuestions() {
  const trial = s.phase === 'trial';
  const asked = s.current?.asked ?? [];
  put($('questions'), ...game.questions.map((q) => el('button', {
    class: `q${asked.includes(q.id) ? ' asked' : ''}`, title: q.text,
    disabled: !(trial && game.canAskNow(q.id)),
    onclick: () => { ui.armed = null; game.ask(q.id); render(); },
  }, el('span', { class: 'qn', text: String(q.order) }), q.heading)));
}

function renderDestinations() {
  const trial = s.phase === 'trial';
  put($('dests'), ...(trial ? game.selectable() : Object.keys(DEST_LABEL).slice(0, 7)).map((d) => el('button', {
    class: `dest d-${d}${ui.armed === d ? ' armed' : ''}`, disabled: !trial,
    onclick: () => {
      if (ui.armed !== d) { ui.armed = d; renderDestinations(); return; }
      ui.armed = null;
      game.decide(d);
      render();
    },
  }, ui.armed === d ? `${DEST_LABEL[d]}で確定` : DEST_LABEL[d])));
}

function pleaOf(caseId) {
  const c = game.caseOf(caseId);
  return c.kind === 'mourning' ? '' : `「${c.plea}」`;
}

function renderOverlay() {
  const ov = $('overlay');
  const next = (label) => el('button', { class: 'next', onclick: () => { game.advance(); ui.armed = null; ui.view = 'sinner'; render(); } }, label);
  let body = null;
  if (s.phase === 'morning') {
    const items = s.morning.items;
    const news = items.filter((i) => i.type === 'news');
    body = [
      el('h2', { text: `${s.day}日目の朝` }),
      items.some((i) => i.type === 'greeting') ? el('div', { class: 'interlude' }, lineNode({ speaker: 'takamura', text: GREETING_PLACEHOLDER })) : null,
      s.day > 1 ? el('h3', { text: '通勤ラッシュのニュース' }) : null,
      s.day > 1 ? (news.length ? el('ul', { class: 'news' }, news.map((n) => el('li', { text: n.text }))) : el('p', { class: 'hint', text: '（ニュースなし）' })) : null,
      interludeNodes(items.filter((i) => i.type === 'interlude')),
      next(s.dayCaseIds.length ? `裁判へ（本日の亡者 ${s.dayCaseIds.length}人）` : '本日の亡者なし'),
    ];
  } else if (s.phase === 'verdict') {
    const r = s.verdict.record;
    body = [
      el('h2', { text: `判決：${DEST_LABEL[r.destination]}` }),
      r.random ? el('p', { class: 'mark', text: '時間切れでランダム送り' }) : r.forced ? el('p', { class: 'mark', text: '強制判決' }) : null,
      interludeNodes(s.verdict.interludes),
      next('次へ'),
    ];
  } else if (s.phase === 'noon') {
    body = [el('h2', { text: '昼休み' }), interludeNodes(s.noon.interludes), next('午後の裁判へ')];
  } else if (s.phase === 'night') {
    const n = s.night;
    body = [
      el('h2', { text: `${s.day}日目の夜` }),
      el('ol', { class: 'verdicts' }, n.records.map((r, i) => el('li', {},
        el('span', { class: 'who', text: `${caseNo(i)}${pleaOf(r.caseId)}` }),
        el('b', { text: ` → ${DEST_LABEL[r.destination]}` }),
        r.random ? el('em', { text: '（ランダム送り）' }) : r.forced ? el('em', { text: '（強制判決）' }) : null))),
      el('p', { class: 'tally', text: `処理件数 ${n.processed}件（差し戻しは含めない）　稼ぎ +${n.earnings}　残業代 −${n.overtime}　所持金 ${s.money}` }),
      next('翌朝へ'),
    ];
  } else if (s.phase === 'end') {
    body = [
      el('h2', { text: 'モックはここまで' }),
      el('p', { text: `所持金 ${s.money}` }),
      el('button', { class: 'next', onclick: () => restart(seed) }, '同じシードで最初から'),
      el('button', { class: 'next', onclick: () => restart(Math.floor(Math.random() * 1e6)) }, '新しいシードで最初から'),
    ];
  }
  ov.hidden = !body;
  if (body) put(ov, el('div', { class: 'sheet' }, body));
}

function restart(newSeed) {
  url.searchParams.set('seed', String(newSeed));
  location.href = url.toString();
}

// --- 隅：シードと時間の速さ
function renderCorner() {
  $('seed').textContent = `seed ${seed}`;
  put($('speed'), el('span', { text: '時間の速さ' }), ...[1, 10].map((v) => el('button', {
    class: speed === v ? 'on' : '', onclick: () => { speed = v; renderCorner(); },
  }, `×${v}`)));
}

// --- 時間を進める。線香が燃えるのは裁判パートの間だけ（day.mjs の tick が決める）
let last = null;
function frame(now) {
  if (last !== null) {
    const dt = Math.min(1, (now - last) / 1000); // 裏に回っていた分は進めない
    game.tick(dt * speed);
    if (stateKey() !== ui.lastKey) render();
    else updateClock();
  }
  last = now;
  requestAnimationFrame(frame);
}

$('forced-line').textContent = FORCED_LINE;
renderCorner();
render();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
